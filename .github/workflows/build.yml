name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: '1.${{ github.run_number }}'

jobs:
  build:
    name: Build Shop Manager Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Install server dependencies
        run: npm install
        working-directory: ./server

      - name: Set version in package.json
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version = process.env.VERSION_NAME;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          console.log('Version set to', pkg.version);
          "

      - name: Build Windows Installer
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify EXE
        shell: bash
        run: |
          set -e
          EXE=$(find dist -name "*.exe" | head -1)
          if [ -z "$EXE" ]; then
            echo "ERROR: No .exe found in dist/"
            ls -lh dist/ || true
            exit 1
          fi
          echo "SUCCESS: $EXE"
          ls -lh "$EXE"

      - name: Prepare release artifact
        shell: bash
        run: |
          mkdir -p release
          cp dist/*.exe "release/ShopManager-Setup.exe"
          ls -lh release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shop-Manager-Windows
          path: release/ShopManager-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and upload EXE
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="build-${VERSION_CODE}"
          RELEASE_NAME="Shop Manager ${VERSION_NAME}"

          # Delete existing release + tag if re-running same build number
          EXISTING_ID=$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)

          if [ -n "$EXISTING_ID" ]; then
            echo "Deleting existing release id=${EXISTING_ID} for tag ${TAG}"
            curl -sS -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${EXISTING_ID}"
            curl -sS -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
            echo "Existing release and tag deleted."
          fi

          # Create release
          PAYLOAD=$(python3 -c "
          import json, os
          print(json.dumps({
            'tag_name': os.environ['TAG'],
            'name': os.environ['RELEASE_NAME'],
            'body': 'Automated build from commit ${GITHUB_SHA::12}',
            'draft': False,
            'prerelease': False
          }))
          " TAG="$TAG" RELEASE_NAME="$RELEASE_NAME")

          RELEASE_RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "$PAYLOAD")

          echo "Release response: $RELEASE_RESPONSE"

          UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data.get('upload_url','').split('{')[0])
          ")

          if [ -z "$UPLOAD_URL" ]; then
            echo "ERROR: Could not extract upload_url"
            exit 1
          fi
          echo "Upload URL: $UPLOAD_URL"

          # Upload EXE asset
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            "${UPLOAD_URL}?name=ShopManager-Setup.exe" \
            --data-binary @release/ShopManager-Setup.exe

          echo "Release ${RELEASE_NAME} published with EXE asset."
